{% extends 'layout.html' %}

{% block conteudo %}

<h2>Saida do Estoque:
<span class="pull-right">
    <a href="{% url 'estoque:estoque_saida_add' %}">
        <button type="button" class="btn btn-primary">
            <span class="fa fa-plus"></span>Adicionar
        </button>
    </a>
</span>
</h2>

{% if object_list %}
 <table class="table table-striped">
    <thead>
        <tr>
            <th>Nf</th>
            <th>Data</th>
            <th>Funcionario</th>
        </tr>
    </thead>
    <tbody>
        {% for object in object_list %}
        <tr>
            <td><a href="{% url 'estoque:estoque_saida_detail' object.id %}">{{ object.nf_formated }}</a></td>
            <td>{{ object.created }}</td>
            <td>{{ object.funcionario }}</td>
        </tr>
        {% endfor %}
    </tbody>
 </table>
{% else %}
 <p class="alert alert-warning">Sem itens na lista</p>
{% endif %}

{% endblock conteudo %}
